<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Arikan — VPN-панель на ядре mihomo (неофициальный форк mikan)">
<title>Arikan — VPN-панель на ядре mihomo (неофициальный форк mikan)</title>
<defs>
<style>
  .bg { fill: #f3f5f7; }
  .ink { fill: #171c24; }
  .muted { fill: #5d6875; }
  .hair { stroke: #d7dee5; }
  .dot { fill: #d7dee5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #11151b; }
    .ink { fill: #f2f5f7; }
    .muted { fill: #93a1ad; }
    .hair { stroke: #262f39; }
    .dot { fill: #262f39; }
  }
  .word { font: 700 84px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.5px; }
  .tag { font: 400 25px "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .note { font: 400 19px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.2px; }
</style>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle class="dot" cx="2" cy="2" r="1.4"/>
</pattern>
</defs>
<rect class="bg" width="1280" height="360"/>
<rect width="1280" height="360" fill="url(#dots)" opacity="0.55"/>
<line class="hair" x1="0" y1="316" x2="1280" y2="316" stroke-width="2"/>
<!-- the placeholder mark: always dark-on-light, whatever the page theme -->
<rect x="96" y="86" width="188" height="188" rx="42" fill="#171c24"/>
<path d="M 148 240 L 190 132 L 232 240" fill="none" stroke="#f2f5f7" stroke-width="26"/>
<line x1="165" y1="204" x2="215" y2="204" stroke="#f2f5f7" stroke-width="22"/>
<rect x="163" y="252" width="54" height="14" rx="7" fill="#4ba3b0"/>
<!-- wordmark -->
<text class="ink word" x="340" y="196">Arikan</text>
<text class="muted tag" x="342" y="242">VPN-панель на ядре mihomo</text>
<text class="muted note" x="342" y="286">неофициальный форк mikan · не связан с проектом mikan и не поддерживается им</text>
