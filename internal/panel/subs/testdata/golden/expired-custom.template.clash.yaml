mode: rule
dns:
  enable: true
  enhanced-mode: fake-ip
proxies:
  - name: '⛔ The subscription has ended — renew it in the bot: https://t.me/example_bot'
    type: socks5
    server: 127.0.0.1
    port: 1
  - name: VLESS XHTTP
    type: vless
    server: 203.0.113.7
    port: 443
    client-fingerprint: chrome
    network: xhttp
    reality-opts:
      public-key: B6N8vBQgk8i3VdwbEOhstCY3StFqqFPtC9_AsrhtHHw
      short-id: a1b2c3d4
    servername: www.example.com
    tls: true
    udp: true
    uuid: 0b4ddc4c-7c4f-4a36-9d62-6f1a44b8c4e1
    xhttp-opts:
      mode: stream-one
      path: /golden-path
      reuse-settings:
        h-max-request-times: 600-900
        h-max-reusable-secs: 1800-3000
        max-concurrency: 16-32
  - name: Hysteria2
    type: hysteria2
    server: 203.0.113.7
    port: 443
    alpn:
      - h3
    fingerprint: ab12
    obfs: salamander
    obfs-password: golden-obfs-password
    password: S3cr3t+/=
    skip-cert-verify: false
  - name: TUIC
    type: tuic
    server: 203.0.113.7
    port: 8443
    alpn:
      - h3
    congestion-controller: bbr
    fingerprint: ab12
    password: S3cr3t+/=
    skip-cert-verify: false
    udp-relay-mode: native
    uuid: 0b4ddc4c-7c4f-4a36-9d62-6f1a44b8c4e1
  - name: VLESS Vision
    type: vless
    server: 203.0.113.7
    port: 8443
    client-fingerprint: chrome
    flow: xtls-rprx-vision
    network: tcp
    reality-opts:
      public-key: B6N8vBQgk8i3VdwbEOhstCY3StFqqFPtC9_AsrhtHHw
      short-id: a1b2c3d4
    servername: www.example.com
    tls: true
    udp: true
    uuid: 0b4ddc4c-7c4f-4a36-9d62-6f1a44b8c4e1
proxy-groups:
  - name: "\U0001F30D Сеть"
    type: select
    proxies:
      - ⚡ Авто
      - "\U0001F1FA\U0001F1F8 США"
      - "\U0001F6AB Без VPN"
  - name: ⚡ Авто
    type: url-test
    proxies:
      - '⛔ The subscription has ended — renew it in the bot: https://t.me/example_bot'
      - VLESS XHTTP
      - TUIC
      - VLESS Vision
    interval: 300
    url: https://www.gstatic.com/generate_204
  - name: "\U0001F1FA\U0001F1F8 США"
    type: select
    proxies:
      - REJECT
  - name: "\U0001F1EF\U0001F1F5 Япония"
    type: select
    proxies:
      - REJECT
  - name: "\U0001F512 VLESS"
    type: select
    proxies:
      - REJECT
  - name: "\U0001F6AB Без VPN"
    type: select
    proxies:
      - DIRECT
rules:
  - IP-CIDR,203.0.113.7/32,DIRECT,no-resolve
  - DOMAIN,vpn.example.com,DIRECT
  - RULE-SET,ru,DIRECT
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - "MATCH,\U0001F30D Сеть"
  - MATCH,REJECT
rule-providers:
  ru:
    type: http
    behavior: domain
    path: ./ru.yaml
    url: https://example.com/ru.yaml
